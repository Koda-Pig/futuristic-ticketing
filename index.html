<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cape Point Stadium</title>
    <style>
      /* Dark while the venue and shell load; the inspector's CSS overrides it. */
      body {
        margin: 0;
        background: #10151c;
        color: #e8edf5;
      }
    </style>
  </head>
  <body>
    <!-- Replaced when the app mounts; shows while the JS bundle downloads. -->
    <div id="root">
      <div
        role="status"
        style="
          position: fixed;
          inset: 0;
          display: grid;
          place-content: center;
          gap: 14px;
          font:
            13px system-ui,
            sans-serif;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          color: #c5d2d6;
        "
      >
        Loading stadium…
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
